<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Verifikim — vizatimi vektorial mbi skanim</title>
<style>
  body{margin:0;background:#222;color:#eee;font:13px/1.4 ui-monospace,monospace}
  .row{display:flex;gap:10px;padding:10px;align-items:flex-start}
  .cell{position:relative;background:#fff}
  .cell img{display:block}
  .cell svg{position:absolute;opacity:.55}
  .cell svg .room-fill{fill:none}
  .cell svg .wall-ext{stroke:#e00}
  .cell svg .wall-int,.cell svg .wall-party{fill:#e00}
  .cell svg .win-cut,.cell svg .rail-cut{fill:#0f0;opacity:.5}
  .cell svg .stair-bg{fill:rgba(0,80,255,.25)}
  .cell svg .stair-tread{stroke:#06f}
  .cell svg .room-hit{fill:none;stroke:#06f;stroke-width:3}
  h3{margin:6px 10px;font-weight:400}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script type="module">
import { FLOORS, BUILDING } from '../js/floors.js';
import { buildPlan } from '../js/plan.js';

// kutia e gabaritit (600×1180 cm) e matur ne piksele mbi cdo skanim
const BOX = {
  perdhesa: { x0: 228, y0: 72,  x1: 645, y1: 900, w: 870, h: 1117 },
  kati1:    { x0: 130, y0: 118, x1: 480, y1: 820, w: 647, h: 1128 },
  kati2:    { x0: 222, y0: 25,  x1: 660, y1: 885, w: 852, h: 1170 }
};
const SCALE = 1.15;

const row = document.getElementById('row');
FLOORS.forEach(f => {
  const b = BOX[f.id];
  const wrap = document.createElement('div');
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.width  = (b.w * SCALE) + 'px';
  cell.style.height = (b.h * SCALE) + 'px';

  const img = document.createElement('img');
  img.src = '../' + f.scan;
  img.style.width  = (b.w * SCALE) + 'px';
  img.style.height = (b.h * SCALE) + 'px';
  cell.appendChild(img);

  const svg = buildPlan(f, { bare: true });
  svg.style.left   = (b.x0 * SCALE) + 'px';
  svg.style.top    = (b.y0 * SCALE) + 'px';
  svg.style.width  = ((b.x1 - b.x0) * SCALE) + 'px';
  svg.style.height = ((b.y1 - b.y0) * SCALE) + 'px';
  cell.appendChild(svg);

  const h = document.createElement('h3');
  h.textContent = f.name;
  wrap.appendChild(h); wrap.appendChild(cell);
  row.appendChild(wrap);
});
</script>
</body>
</html>
